
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .logo {
            color: #d11a2a; /* رنگ قرمز لوگو */
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .checkmark {
            background-color: #4CAF50;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .checkmark svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        h1 {
            font-size: 36px;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .subtitle {
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .info {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #888;
        }

    </style>
</head>
<body>

    <div class="logo">3DS SOLIDWORKS</div>

    <div class="checkmark">
        <svg viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
    </div>

    <h1>VALID</h1>
    
    <div class="subtitle">SOLIDWORKS Design Professional (CSWP)</div>
    
    <div class="info">
        Issued to:<br>

        <strong>Abolfazl Pourallahyari</strong><br><br>
        Issued on<br>
        <strong>February 28, 2025</strong>
    </div>

    <div class="footer">
        SOLIDWORKS® is a registered trademark of Dassault Systèmes<br>
        3DEXPERIENCE® is a registered trademark of Dassault Systèmes
    </div>

</body>
</html>
